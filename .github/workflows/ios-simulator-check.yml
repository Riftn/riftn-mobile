name: iOS simulator check

# Builds the iPhone app in Release with the same Xcode as the store build,
# runs it on an iPhone simulator, opens every main page in light and dark,
# and keeps the screenshots, the app log and any crash reports. Run it from
# Actions before an App Store submission.
#
# task "nav" times page switches instead (tabs, profiles, posts, Settings,
# Back): once with main's app code and once with this branch's, in the same
# native build, so the two columns differ only by the change being checked.
on:
  workflow_dispatch:
    inputs:
      themes:
        description: 'Walks to run, space separated: dark, light, syslight (System Light)'
        required: false
        default: 'dark light syslight'
      task:
        description: 'walk = open every page and screenshot it. nav = time page switches, main against this branch. probe = look for where a switch spends its time. touch = real finger swipes back and a tap, with a picture of each. shorts = how soon the next short plays after a real swipe, main against this branch. keys = can the keyboard always be closed (the X in the Explore pill, Done on number pads, a drag of the page). wide = a wide video in the swipe player, pictured on five themes. shells = a picture of every page held on its loading shell, then of the page (themes = app themes, e.g. system hazy). bones = measure every page layout for its loading placeholder. wallet = Connect Wallet on the sign-in page, main against this branch. loginsheet = the sign-in pop-ups from a like, from + and the Log in page, main against this branch. player = loop off by default, a short moving on when it ends, the Shorts menu player rows and the When? wheel. menu = the phone menu in tabs, sections and folders, with the search row. speed = chats, typing, search and the busiest switches timed, main against this branch (use account=review). livetheme = open a live and go Back in System Light, Home pictured right after, main against this branch. reactions = reactions landing live in public chat, filmed in three themes'
        required: false
        default: 'walk'
      app_run_id:
        description: 'nav only: reuse the simulator app an earlier run of this workflow built (its run id), when native code has not changed'
        required: false
        default: ''
      minify:
        description: "speed only: false keeps component names in the bundle, so each step also lists which components built the most (times from such a run are not comparable)"
        required: false
        default: 'true'
      rounds:
        description: 'nav and speed: how many before/after rounds'
        required: false
        default: '2'
      device:
        description: 'walk only: iphone, ipad (an iPad simulator, upright then on its side) or duo (the iPhone Duo folding phone, built with Xcode 27)'
        required: false
        default: 'iphone'
      xcode:
        description: "26.2 (the store build's Xcode today) or 27 (the newest Xcode 27 on the runner; duo always uses it)"
        required: false
        default: '26.2'
      account:
        description: "nav, probe and speed: 'review' signs the simulator in with the sign-in Apple's reviewers use, so signed-in pages are covered (no films, personal pages not pictured, results kept 2 days)"
        required: false
        default: ''
  pull_request:
    paths:
      - .github/workflows/ios-simulator-check.yml
      - scripts/ios-simulator-walk.sh

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-simulator-check-${{ github.ref }}-${{ inputs.task || 'walk' }}-${{ inputs.device || 'iphone' }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build and walk the app on an iPhone simulator
    runs-on: ${{ (inputs.device == 'duo' || startsWith(inputs.xcode, '27')) && 'xcode-27' || 'macos-15' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use the store build's Xcode
        run: |
          WANT="${{ inputs.xcode || '26.2' }}"
          if [ "${{ inputs.device }}" = "duo" ]; then WANT=27; fi
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_${WANT}*.app | grep -v -i beta | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then echo "No Xcode $WANT on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - run: npm ci --legacy-peer-deps
      - run: npx patch-package --error-on-fail
      - name: Prepare recording extension targets
        if: inputs.app_run_id == ''
        run: |
          gem install xcodeproj --version 1.27.0 --no-document
          ruby scripts/configure-screen-capture-targets.rb
      # Plain install, as the store build does: the committed Podfile.lock
      # trails autolinking, so --deployment refuses it.
      - name: Install pods
        if: inputs.app_run_id == ''
        working-directory: ios
        run: pod install
      - name: Run the code in this commit, not the latest published update
        if: inputs.app_run_id == ''
        run: plutil -replace EXUpdatesEnabled -bool NO ios/DeHub/Supporting/Expo.plist
      - name: Boot an iPhone simulator
        id: sim
        run: |
          TYPE="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          names = [d["name"] for d in json.load(sys.stdin)["devicetypes"]]
          wants = ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro"]
          if sys.argv[1] == "duo":
              print("Device types:", ", ".join(names), file=sys.stderr)
              wants = [n for n in names if "Duo" in n or "Fold" in n]
          if sys.argv[1] == "ipad":
              wants = [n for n in names if n.startswith("iPad Air 11-inch")][::-1] + [n for n in names if n.startswith("iPad Pro 11-inch")][::-1] + [n for n in names if n.startswith("iPad")][::-1]
          for want in wants:
              if want in names:
                  print(want); break' "${{ inputs.device || 'iphone' }}")"
          # Newest iOS runtime that can run that device (the iPhone Duo has its
          # own device-specific runtimes, and the newest generic one refuses it).
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          ok = [r for r in rs if any(d.get("name") == sys.argv[1] for d in r.get("supportedDeviceTypes", []))]
          rs = ok or rs
          rs.sort(key=lambda r: [int(p) for p in r["version"].split(".")])
          print(rs[-1]["identifier"])' "$TYPE")"
          UDID="$(xcrun simctl create riftn-check "$TYPE" "$RUNTIME")"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $TYPE on $RUNTIME"
      # Signed to run locally, as Xcode does for a simulator: an unsigned app
      # gets no keychain there, so sign-in state never loads.
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # The app's config (Supabase key and the rest) is inlined into the bundle
      # at build time from the EAS production environment, as the store build
      # does. Without it the app throws "supabaseKey is required" on launch.
      - name: Build Release for the simulator
        if: inputs.app_run_id == ''
        run: |
          cat > "$RUNNER_TEMP/build-sim.sh" <<'SH'
          set -o pipefail
          xcodebuild -workspace ios/DeHub.xcworkspace -scheme DeHub \
            -configuration Release -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/sim" \
            ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER= build 2>&1 | tee xcodebuild.log | xcbeautify --quiet
          SH
          eas env:list production | sed -E 's/=.*/= <set>/'
          eas env:exec production "bash $RUNNER_TEMP/build-sim.sh"
      # Kept so a later nav run can skip the hour-long native build.
      - name: Pack the simulator app
        if: inputs.app_run_id == ''
        run: |
          APP="$(find "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          tar -czf "$RUNNER_TEMP/ios-simulator-app.tgz" -C "$(dirname "$APP")" "$(basename "$APP")"
      - uses: actions/upload-artifact@v4
        if: inputs.app_run_id == ''
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/ios-simulator-app.tgz
          retention-days: 14
          compression-level: 0
      - uses: actions/download-artifact@v4
        if: inputs.app_run_id != ''
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/app-download
          run-id: ${{ inputs.app_run_id }}
          github-token: ${{ github.token }}
      - name: Unpack the reused simulator app
        if: inputs.app_run_id != ''
        run: |
          mkdir -p "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator"
          tar -xzf "$RUNNER_TEMP/app-download/ios-simulator-app.tgz" -C "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator"
      # iOS 26 asks "Open in …?" before a simulator opens a deep link; idb taps Open.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Without it no deep link opens and the whole walk is wasted, so this
      # retries the download (GitHub release downloads flake) and then fails.
      - name: Install idb for taps
        run: |
          brew tap facebook/fb
          for attempt in 1 2 3 4; do
            brew install facebook/fb/idb-companion && break
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 20))
          done
          python -m venv "$RUNNER_TEMP/idb"
          "$RUNNER_TEMP/idb/bin/pip" install --quiet fb-idb pillow
          echo "$RUNNER_TEMP/idb/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/idb/bin/idb" list-targets || true
      - name: Summarise build warnings
        if: always()
        run: |
          mkdir -p sim-check
          touch xcodebuild.log
          grep -E "(warning|error):" xcodebuild.log | grep -v "/Pods/" | sort | uniq -c | sort -rn > sim-check/app-warnings.txt || true
          grep -cE "warning:" xcodebuild.log > sim-check/warning-count.txt || true
          gzip -c xcodebuild.log > sim-check/xcodebuild.log.gz
      - name: Walk every page in dark, light and System Light
        if: inputs.task != 'nav' && inputs.task != 'probe' && inputs.task != 'touch' && inputs.task != 'shorts' && inputs.task != 'keys' && inputs.task != 'wide' && inputs.task != 'shells' && inputs.task != 'bones' && inputs.task != 'wallet' && inputs.task != 'loginsheet' && inputs.task != 'player' && inputs.task != 'menu' && inputs.task != 'speed' && inputs.task != 'livetheme' && inputs.task != 'reactions'
        timeout-minutes: 45
        run: |
          APP="$(find "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          scripts/ios-simulator-walk.sh "${{ steps.sim.outputs.udid }}" "$APP" sim-check
        env:
          THEMES: ${{ inputs.themes || 'dark light syslight' }}
          DEVICE: ${{ inputs.device || 'iphone' }}
      - name: Time page switches, main against this branch
        if: inputs.task == 'nav' || inputs.task == 'probe' || inputs.task == 'touch' || inputs.task == 'shorts' || inputs.task == 'keys' || inputs.task == 'wide' || inputs.task == 'shells' || inputs.task == 'bones' || inputs.task == 'wallet' || inputs.task == 'loginsheet' || inputs.task == 'player' || inputs.task == 'menu' || inputs.task == 'speed' || inputs.task == 'livetheme' || inputs.task == 'reactions'
        env:
          NAV_MODE: ${{ inputs.task }}
          MINIFY: ${{ inputs.minify || 'true' }}
          ROUNDS: ${{ inputs.rounds || '2' }}
          SHELL_THEMES: ${{ inputs.task == 'shells' && inputs.themes || '' }}
          SIM_TEST_KEY: ${{ secrets.SIM_TEST_KEY }}
          # Read from App Store Connect inside the script; never printed.
          SIM_REVIEW_LOGIN: ${{ inputs.account == 'review' && '1' || '0' }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          APP="$(find "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          scripts/ios-nav-timing.sh "${{ steps.sim.outputs.udid }}" "$APP" sim-check
      # The films go up on their own: one 100 MB upload stalled and took the
      # numbers and screenshots down with it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-check
          path: |
            sim-check/
            !sim-check/**/*.mov
          if-no-files-found: ignore
          # 0 keeps the repository's usual time.
          retention-days: ${{ inputs.account == 'review' && 2 || 0 }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ios-simulator-films
          path: sim-check/**/*.mov
          if-no-files-found: ignore
          compression-level: 0
