name: App Store status

on:
  workflow_dispatch:
    inputs:
      release_if_approved:
        description: Release the version if Apple approved it and it waits on us
        type: boolean
        default: false
      promotional_text:
        description: Set the App Store promotional text (no review needed, max 170 characters)
        type: string
        default: ''
      submit_version:
        description: Send this version's newest processed build to App Review (for example 1.19.1)
        type: string
        default: ''
      submit_build:
        description: Submit this exact processed build number when specified
        type: string
        default: ''
      manual_release:
        description: Hold the submitted version for manual release after approval
        type: boolean
        default: false
      whats_new:
        description: The "What's New" text for that version
        type: string
        default: ''
      screenshots_run_id:
        description: 'iPad screenshots: the run id of an "iOS simulator check" with device ipad13'
        type: string
        default: ''
      screenshots:
        description: 'iPad screenshots: picture names from that run, in order, space separated (max 10)'
        type: string
        default: ''
      screenshots_version:
        description: 'iPad screenshots: the version to put them on (made if not there yet, for example 1.20.0)'
        type: string
        default: ''
      save_screenshots:
        description: "Keep a copy of the newest version's listing screenshots as a download"
        type: boolean
        default: false
      review_login_shape:
        description: Also say what kind of sign-in the review account is (never its values)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: app-store-status
  cancel-in-progress: false

jobs:
  status:
    name: Read App Store status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        if: inputs.screenshots_run_id != ''
        with:
          name: ios-simulator-shots
          path: ${{ runner.temp }}/ipad-shots
          run-id: ${{ inputs.screenshots_run_id }}
          github-token: ${{ github.token }}
      - name: Print App Store and TestFlight status
        env:
          SCREENSHOTS_DIR: ${{ inputs.screenshots_run_id != '' && format('{0}/ipad-shots', runner.temp) || '' }}
          SCREENSHOTS: ${{ inputs.screenshots }}
          SCREENSHOTS_VERSION: ${{ inputs.screenshots_version }}
          SAVE_SCREENSHOTS_DIR: ${{ inputs.save_screenshots && format('{0}/listing-shots', runner.temp) || '' }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_IF_APPROVED: ${{ inputs.release_if_approved }}
          PROMOTIONAL_TEXT: ${{ inputs.promotional_text }}
          SUBMIT_VERSION: ${{ inputs.submit_version }}
          SUBMIT_BUILD: ${{ inputs.submit_build }}
          MANUAL_RELEASE: ${{ inputs.manual_release }}
          WHATS_NEW: ${{ inputs.whats_new }}
        run: node scripts/app-store-status.mjs
      - uses: actions/upload-artifact@v4
        if: inputs.save_screenshots
        with:
          name: app-store-screenshots
          path: ${{ runner.temp }}/listing-shots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Review sign-in shape
        if: ${{ inputs.review_login_shape }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/ios-nav/review-login.mjs --shape | tee -a "$GITHUB_STEP_SUMMARY"
